[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-stats-desktop"
version = "0.1.0"
description = "Native Windows desktop UI for MT5 trading-stats (PySide6); reuses trading-stats core."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "PySide6>=6.6",
  "matplotlib>=3.8",
  "polars>=0.20,<2",
]


[project.scripts]
trading-stats-desktop = "trading_stats_desktop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
