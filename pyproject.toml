[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-stats"
version = "0.1.0"
description = "Multi-account MT5 deal export — core data library (ingest, KPIs, paths)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "polars>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
