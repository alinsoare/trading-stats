name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  # ── Linux: native binary + .deb ─────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Fyne build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev fakeroot dpkg

      - name: Build standalone Linux binary
        env:
          CGO_ENABLED: '1'
        run: |
          cd go
          go build -trimpath -ldflags "-s -w" -o ../trading-stats-linux-amd64 .

      - name: Build .deb
        env:
          PKG_VERSION: ${{ github.ref_name }}
        run: |
          export PKG_VERSION="${PKG_VERSION#v}"
          bash linux/build_deb.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            linux/dist/*.deb
            trading-stats-linux-amd64

  # ── Windows: standalone .exe ────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build standalone Windows .exe
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          Set-Location go
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o "..\TradingStats-$ver.exe" .

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: TradingStats-*.exe

  # ── GitHub Release with all files ──────────────────────────────────────────
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
